[package]
name = "metal-deinterlace"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "yadif deinterlacing on the GPU (Metal) over CoreVideo pixel buffers, per field or per frame."

[dependencies]
anyhow = "1"
apple-media = { path = "../apple-media" }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-metal"] }
objc2-foundation = "0.3"
objc2-metal = "0.3"

[dev-dependencies]
libc = "0.2"
mpegts = { path = "../mpegts" }

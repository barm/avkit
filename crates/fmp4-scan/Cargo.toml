[package]
name = "fmp4-scan"
version = "0.1.0"
edition = "2024"
description = "Decode a fragmented MP4 recording (HEVC + AAC) into small grey pictures and mono sound for analysis, in hardware on macOS."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barm/avkit"

[dependencies]
anyhow = "1"
apple-media = { path = "../apple-media" }
fmp4 = { path = "../fmp4" }
